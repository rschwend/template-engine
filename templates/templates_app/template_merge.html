{% extends "base.html" %}

{% block title %}Template Merge{% endblock %}

{% block content %}
<h1 class="mb-1">Template View</h1>

<div class="card merge-section">
    <h2>Template suchen</h2>
    <div class="form-group">
        <input type="text" id="search-input" class="form-control" placeholder="Suche in Betreff und Inhalt...">
    </div>
    <div id="search-results" class="search-results" style="display:none;"></div>
</div>

<div class="card merge-section">
    <h2>Template auswählen</h2>
    <div class="form-group">
        <select id="template-select" class="form-control">
            <option value="">-- Template wählen --</option>
            {% for t in templates %}
                <option value="{{ t.pk }}">{{ t.name }}</option>
            {% endfor %}
        </select>
    </div>
</div>

<div id="variables-section" class="card merge-section" style="display:none;">
    <h2>Variablen befüllen</h2>
    <div id="variable-fields" class="variable-fields"></div>
</div>

<div id="preview-section" class="card merge-section" style="display:none;">
    <h2>Vorschau</h2>
    <div class="preview-subject" id="preview-subject"></div>
    <div class="preview-box" id="preview-body"></div>
</div>
{% endblock %}

{% block extra_scripts %}
{% verbatim %}
<script>
(function() {
    var select = document.getElementById('template-select');
    var variablesSection = document.getElementById('variables-section');
    var variableFields = document.getElementById('variable-fields');
    var previewSection = document.getElementById('preview-section');
    var previewSubject = document.getElementById('preview-subject');
    var previewBody = document.getElementById('preview-body');
    var searchInput = document.getElementById('search-input');
    var searchResults = document.getElementById('search-results');

    var currentTemplate = null;
    var searchTimeout = null;

    // Search functionality
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        var query = searchInput.value.trim();
        if (!query) {
            searchResults.style.display = 'none';
            searchResults.innerHTML = '';
            return;
        }
        searchTimeout = setTimeout(function() {
            performSearch(query);
        }, 300);
    });

    async function performSearch(query) {
        var resp = await fetch('/templates/api/search/?q=' + encodeURIComponent(query));
        var data = await resp.json();
        searchResults.innerHTML = '';

        if (data.results.length === 0) {
            searchResults.innerHTML = '<div class="search-result-empty">Keine Ergebnisse gefunden.</div>';
            searchResults.style.display = '';
            return;
        }

        data.results.forEach(function(item) {
            var div = document.createElement('div');
            div.className = 'search-result-item';
            div.setAttribute('data-pk', item.id);
            div.innerHTML = '<strong>' + escapeHtml(item.name) + '</strong>' +
                '<span class="search-result-subject">' + escapeHtml(item.subject) + '</span>';
            div.addEventListener('click', function() {
                selectTemplate(item.id);
            });
            searchResults.appendChild(div);
        });
        searchResults.style.display = '';
    }

    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Select a template by PK (used by both dropdown and search results)
    async function selectTemplate(pk) {
        // Sync the dropdown
        select.value = pk;

        var resp = await fetch('/templates/api/' + pk + '/variables/');
        var data = await resp.json();
        currentTemplate = data;

        // Build variable input fields
        variableFields.innerHTML = '';
        if (data.variables.length > 0) {
            data.variables.forEach(function(varName) {
                var div = document.createElement('div');
                div.className = 'form-group';
                div.innerHTML = '<label for="var-' + varName + '">' +
                    '{{' + varName + '}}</label>' +
                    '<input type="text" id="var-' + varName + '" class="form-control var-input" ' +
                    'data-var="' + varName + '" placeholder="' + varName + '">';
                variableFields.appendChild(div);
            });
            variablesSection.style.display = '';

            // Attach live-update listeners
            document.querySelectorAll('.var-input').forEach(function(input) {
                input.addEventListener('input', renderPreview);
            });
        } else {
            variablesSection.style.display = 'none';
        }

        renderPreview();
        previewSection.style.display = '';

        // Hide search results after selection
        searchResults.style.display = 'none';
    }

    select.addEventListener('change', function() {
        var pk = this.value;
        if (!pk) {
            variablesSection.style.display = 'none';
            previewSection.style.display = 'none';
            currentTemplate = null;
            return;
        }
        selectTemplate(pk);
    });

    function renderPreview() {
        if (!currentTemplate) return;

        var subject = currentTemplate.subject;
        var body = currentTemplate.body;

        document.querySelectorAll('.var-input').forEach(function(input) {
            var varName = input.dataset.var;
            var value = input.value || ('{{' + varName + '}}');
            var placeholder = '{{' + varName + '}}';
            subject = subject.split(placeholder).join(value);
            body = body.split(placeholder).join(value);
        });

        previewSubject.textContent = 'Betreff: ' + subject;
        previewBody.textContent = body;
    }
})();
</script>
{% endverbatim %}
{% endblock %}
